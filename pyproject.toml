[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "sp-vision-25-python"
version = "0.1.0"
description = "Python workspace for scripts, tests, and future bindings in sp_vision_25."
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4.4",
    "pybind11>=3.0.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "textual>=8.2.4",
    "typer>=0.24.1",
]

[project.scripts]
sp-vision-diagnose = "sp_vision_25_python.diagnose.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
